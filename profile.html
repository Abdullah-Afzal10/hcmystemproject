<div class="profile-center-wrapper">
    <div class="profile-content-box">
        
        <!-- Welcome Header -->
        <div class="mb-3">
            <h4 class="fw-bold m-0 text-dark">Hello, Ali Raza 👋</h4>
            <small class="text-muted">Here's your overview for today</small>
        </div>

        <!-- 2x2 Stats Grid -->
        <div class="row g-2 mb-3">
            <!-- Today's Status -->
            <div class="col-6">
                <div class="p-2 border rounded bg-white d-flex align-items-center gap-2 h-100">
                    <div class="icon-shape bg-status-green"><i class="fa-solid fa-circle-check"></i></div>
                    <div>
                        <div class="txt-label">Today's Status</div>
                        <div class="fw-bold text-success" style="font-size: 14px;">Present</div>
                    </div>
                </div>
            </div>

            <!-- This Month's Leaves -->
            <div class="col-6">
                <div class="p-2 border rounded bg-white d-flex align-items-center gap-2 h-100">
                    <div class="icon-shape bg-status-blue"><i class="fa-solid fa-calendar-days"></i></div>
                    <div>
                        <div class="txt-label">This Month's Leaves</div>
                        <div class="fw-bold text-dark" style="font-size: 14px;">1 / 18</div>
                    </div>
                </div>
            </div>

            <!-- Attendance Status -->
            <div class="col-6">
                <div class="p-2 border rounded bg-white d-flex align-items-center gap-2 h-100">
                    <div class="icon-shape bg-status-yellow"><i class="fa-solid fa-clock"></i></div>
                    <div>
                        <div class="txt-label">Attendance</div>
                        <div class="fw-bold text-warning" style="font-size: 14px;">On Time</div>
                    </div>
                </div>
            </div>

            <!-- Next Leave -->
            <div class="col-6">
                <div class="p-2 border rounded bg-white d-flex align-items-center gap-2 h-100">
                    <div class="icon-shape bg-status-purple"><i class="fa-solid fa-calendar-plus"></i></div>
                    <div>
                        <div class="txt-label">Next Leave</div>
                        <div class="fw-bold" style="font-size: 14px; color: #4f46e5;">In 7 days</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions Section -->
        <div class="mb-3">
            <h6 class="fw-bold text-dark mb-2" style="font-size: 13px;">Quick Actions</h6>
            <div class="row g-2">
                <div class="col-6">
                    <button class="btn btn-light border w-100 p-2 d-flex align-items-center justify-content-center gap-2 small fw-semibold text-dark">
                        <i class="fa-solid fa-pen-to-square text-primary"></i> Apply Leave
                    </button>
                </div>
                <div class="col-6">
                    <button class="btn btn-light border w-100 p-2 d-flex align-items-center justify-content-center gap-2 small fw-semibold text-dark">
                        <i class="fa-solid fa-calendar-check text-primary"></i> View Attendance
                    </button>
                </div>
            </div>
        </div>

        <!-- Smart Helper Banner -->
        <div class="p-2 rounded-3 border d-flex align-items-center justify-content-between bg-helper-blue cursor-pointer">
            <div class="d-flex align-items-center gap-2">
                <div class="icon-shape bg-primary text-white" style="font-size: 16px;"><i class="fa-solid fa-robot"></i></div>
                <div>
                    <div class="fw-bold text-primary" style="font-size: 12px;">Need help?</div>
                    <div class="text-muted" style="font-size: 11px;">Ask our smart helper</div>
                </div>
            </div>
            <i class="fa-solid fa-arrow-right text-primary me-2"></i>
        </div>

    </div>
</div>
