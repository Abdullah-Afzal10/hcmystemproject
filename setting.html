<div class="container-fluid my-4" style="max-width: 500px;">
    <div class="card p-3 shadow-sm border-0" style="border-radius: 12px; background: #fff;">
        
        <!-- Title & Tabs -->
        <h4 class="fw-bold mb-3 text-dark">Company Settings</h4>
        <ul class="nav nav-pills gap-1 mb-3 bg-light p-1 rounded-2" id="st" role="tablist">
            <li class="nav-item flex-grow-1 text-center"><button class="nav-link btn-sm active w-100 py-1" data-bs-toggle="tab" data-bs-target="#t1" type="button" style="font-size: 12px;">General</button></li>
            <li class="nav-item flex-grow-1 text-center"><button class="nav-link btn-sm w-100 py-1" data-bs-toggle="tab" data-bs-target="#t2" type="button" style="font-size: 12px;">Office Hours</button></li>
            <li class="nav-item flex-grow-1 text-center"><button class="nav-link btn-sm w-100 py-1" data-bs-toggle="tab" data-bs-target="#t3" type="button" style="font-size: 12px;">Leave Policy</button></li>
            <li class="nav-item flex-grow-1 text-center"><button class="nav-link btn-sm w-100 py-1" data-bs-toggle="tab" data-bs-target="#t4" type="button" style="font-size: 12px;">Other</button></li>
        </ul>

        <form class="tab-content" id="stC">
            <!-- 1. General Tab (Exact Image Replica) -->
            <div class="tab-pane fade show active" id="t1" role="tabpanel">
                <div class="mb-2"><label class="lbl">Company Name</label><input type="text" class="form-control form-control-sm" value="Tech Solutions Ltd."></div>
                <div class="mb-2"><label class="lbl">Address</label><textarea class="form-control form-control-sm" rows="2">123 Business Street, Karachi</textarea></div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><label class="lbl">Start Time</label><input type="time" class="form-control form-control-sm" value="09:00"></div>
                    <div class="col-6"><label class="lbl">End Time</label><input type="time" class="form-control form-control-sm" value="17:00"></div>
                </div>
                <div class="mb-2"><label class="lbl">Grace Minutes</label><input type="number" class="form-control form-control-sm" value="10"><span class="txt-sub">(Late by this many minutes is allowed)</span></div>
                <div class="mb-3"><label class="lbl">Leave Quota (Annual)</label><input type="number" class="form-control form-control-sm" value="18"><span class="txt-sub">(Days per year)</span></div>
            </div>

            <!-- 2. Office Hours Tab -->
            <div class="tab-pane fade" id="t2" role="tabpanel">
                <label class="lbl mb-1">Working Days</label>
                <div class="p-2 border rounded mb-2 bg-light">
                    <div class="d-flex justify-content-between mb-1 pb-1 border-bottom small"><span>Mon - Fri</span><div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked></div></div>
                    <div class="d-flex justify-content-between mb-1 pb-1 border-bottom small"><span>Saturday</span><div class="form-check form-switch"><input class="form-check-input" type="checkbox"></div></div>
                    <div class="d-flex justify-content-between small"><span>Sunday</span><div class="form-check form-switch"><input class="form-check-input" type="checkbox"></div></div>
                </div>
                <div class="mb-3"><label class="lbl">Break Duration (Mins)</label><input type="number" class="form-control form-control-sm" value="60"></div>
            </div>

            <!-- 3. Leave Policy Tab -->
            <div class="tab-pane fade" id="t3" role="tabpanel">
                <div class="mb-2"><label class="lbl">Max Consecutive Leaves</label><input type="number" class="form-control form-control-sm" value="5"></div>
                <div class="mb-2"><label class="lbl">Notice Period (Days)</label><input type="number" class="form-control form-control-sm" value="3"></div>
                <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="cf" checked><label class="form-check-label small" for="cf">Allow carry forward</label></div>
            </div>

            <!-- 4. Other Tab -->
            <div class="tab-pane fade" id="t4" role="tabpanel">
                <div class="mb-2"><label class="lbl">Currency Symbol</label><input type="text" class="form-control form-control-sm" value="PKR (Rs.)"></div>
                <div class="mb-2"><label class="lbl">Alert Email</label><input type="email" class="form-control form-control-sm" value="hr@company.com"></div>
                <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="ai" checked><label class="form-check-label small" for="ai">Enable AI Assistant</label></div>
            </div>

            <!-- Global Action Button -->
            <button type="submit" class="btn btn-primary btn-sm w-100 py-2 fw-semibold">Save Changes</button>
        </form>

    </div>
</div>
