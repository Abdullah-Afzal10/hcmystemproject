 <div class="container-fluid my-4" style="max-width: 600px; margin: 0 auto;">
    <div class="card p-3 shadow-sm" style="border-radius: 12px;">
        
        <!-- Header: Title and Month Dropdown -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold m-0 text-dark">Payslip</h4>
            <select class="form-select form-select-sm w-auto font-12 fw-medium border-secondary-subtle">
                <option>October 2025</option>
                <option>September 2025</option>
            </select>
        </div>

        <!-- Employee Metadata Details -->
        <div class="row g-2 mb-3 border-bottom pb-2">
            <div class="col-6">
                <div class="txt-sub">Employee</div>
                <div class="fw-bold text-dark font-14">Ali Raza</div>
            </div>
            <div class="col-6">
                <div class="txt-sub">Employee ID</div>
                <div class="fw-bold text-dark font-14">EMP001</div>
            </div>
        </div>

        <!-- Payslip Breakdown Table List -->
        <div class="border rounded overflow-hidden mb-3">
            <!-- Row 1: Basic Salary -->
            <div class="d-flex justify-content-between align-items-center p-2 border-bottom font-13">
                <span class="text-primary-emphasis fw-medium">Basic Salary</span>
                <span class="fw-semibold text-dark">50,000</span>
            </div>
            <!-- Row 2: Allowances -->
            <div class="d-flex justify-content-between align-items-center p-2 border-bottom font-13">
                <span class="text-primary-emphasis fw-medium">Allowances</span>
                <span class="fw-semibold text-dark">10,000</span>
            </div>
            <!-- Row 3: Deductions -->
            <div class="d-flex justify-content-between align-items-center p-2 border-bottom font-13">
                <span class="text-primary-emphasis fw-medium">Deductions</span>
                <span class="fw-semibold text-dark">-5,000</span>
            </div>
            <!-- Row 4: Net Salary (Exact Soft Green Highlight) -->
            <div class="d-flex justify-content-between align-items-center p-2 bg-success-light font-14 fw-bold">
                <span class="text-success">Net Salary</span>
                <span class="text-success">55,000</span>
            </div>
        </div>

        <!-- Action Utility Buttons -->
        <div class="row g-2">
            <div class="col-6">
                <button class="btn btn-primary btn-sm w-100 py-2 font-13 fw-semibold d-flex align-items-center justify-content-center gap-2">
                    <i class="fa-solid fa-print"></i> Print
                </button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-secondary btn-sm w-100 py-2 font-13 fw-semibold d-flex align-items-center justify-content-center gap-2 text-dark bg-white border-secondary-subtle">
                    <i class="fa-solid fa-file-pdf text-primary"></i> Save as PDF
                </button>
            </div>
        </div>

    </div>
